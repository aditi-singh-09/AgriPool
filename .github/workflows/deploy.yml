name: Deploy Contracts to Testnet

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32v1-none

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Install cargo-binstall
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash

      - name: Install Stellar CLI
        run: cargo binstall --no-confirm stellar-cli

      - name: Build contract
        working-directory: contracts
        run: stellar contract build

      - name: Deploy to Testnet
        working-directory: contracts
        run: |
          stellar keys generate deployer --network testnet --fund || true
          CONTRACT_ID=$(stellar contract deploy \
            --wasm target/wasm32v1-none/release/agripool_contract.wasm \
            --source deployer \
            --network testnet)
          echo "Contract deployed at: $CONTRACT_ID"
          TOKEN_ID=$(stellar contract id asset --asset native --network testnet)
          echo "Native Token ID: $TOKEN_ID"
